<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DruvaTalks - All in One Skill Hub</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="druvatalks-seal.png">

<!-- Instant redirect fallback for no-JS / very slow devices -->
<noscript><meta http-equiv="refresh" content="0; url=index.html"></noscript>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap');
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800&display=swap');

  :root{
    --golden: #C9A24A;
    --golden-soft: rgba(201,162,74,0.35);
    --blackish: #14100B;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin: 0;
    height: 100%;
    background: radial-gradient(ellipse at top, #1B140B 0%, #0B0906 55%, #0B0906 100%);
    overflow: hidden;
  }

  body{
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Inter', sans-serif;
    cursor: pointer;
  }

  .splash{
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 0 1.5rem;
  }

  /* Emblem: a thin golden ring that draws itself, echoing the brand seal */
  .emblem{
    position: relative;
    width: 96px;
    height: 96px;
    margin-bottom: 1.75rem;
  }

  .emblem svg{
    width: 100%;
    height: 100%;
    transform: rotate(-90deg);
  }

  .emblem circle{
    fill: none;
    stroke: var(--golden);
    stroke-width: 1.4;
    stroke-linecap: round;
  }

  .emblem .track{
    stroke: rgba(201,162,74,0.15);
  }

  .emblem .ring{
    stroke-dasharray: 264;
    stroke-dashoffset: 264;
    animation: draw-ring 1.1s cubic-bezier(0.65,0,0.35,1) 0.15s forwards;
  }

  .emblem .mark{
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    animation: mark-in 0.6s ease-out 0.95s forwards;
  }

  .emblem .seal{
    width: 54%;
    height: 54%;
    object-fit: contain;
    filter: drop-shadow(0 0 10px rgba(201,162,74,0.25));
    display: block;
  }

  .wordmark{
    font-family: 'Orbitron', sans-serif;
    font-weight: 700;
    font-size: clamp(1.6rem, 5vw, 2.4rem);
    letter-spacing: 0.06em;
    color: #F5EFE2;
    opacity: 0;
    transform: translateY(8px);
    animation: rise-in 0.7s ease-out 1.15s forwards;
  }

  .wordmark span{ color: var(--golden); }

  .tagline{
    margin-top: 0.6rem;
    font-size: 0.78rem;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: rgba(245,239,226,0.55);
    opacity: 0;
    animation: rise-in 0.7s ease-out 1.4s forwards;
  }

  .hairline{
    margin-top: 1.6rem;
    width: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--golden), transparent);
    animation: line-grow 0.8s ease-out 1.55s forwards;
  }

  @keyframes draw-ring{
    to{ stroke-dashoffset: 0; }
  }
  @keyframes mark-in{
    to{ opacity: 1; }
  }
  @keyframes rise-in{
    to{ opacity: 1; transform: translateY(0); }
  }
  @keyframes line-grow{
    to{ width: 140px; }
  }

  /* Whole-page exit */
  body.leaving .splash{
    animation: fade-out 0.5s ease-in forwards;
  }
  @keyframes fade-out{
    to{ opacity: 0; transform: scale(0.98); }
  }

  @media (prefers-reduced-motion: reduce){
    .emblem .ring, .emblem .mark, .wordmark, .tagline, .hairline, body.leaving .splash{
      animation: none !important;
      opacity: 1 !important;
      stroke-dashoffset: 0 !important;
      transform: none !important;
      width: 140px !important;
    }
  }
</style>
</head>
<body>

  <div class="splash">
    <div class="emblem">
      <svg viewBox="0 0 96 96">
        <circle class="track" cx="48" cy="48" r="42"></circle>
        <circle class="ring" cx="48" cy="48" r="42"></circle>
      </svg>
      <div class="mark">
        <img class="seal" src="druvatalks-seal.png" alt="DruvaTalks seal" />
      </div>
    </div>

    <div class="wordmark">Druva<span>Talks</span></div>
    <div class="tagline">All in One Skill Hub</div>
    <div class="hairline"></div>
  </div>

<script>
  var redirectTarget = "home.html";
  var hasLeft = false;

  function leave(){
    if (hasLeft) return;
    hasLeft = true;
    document.body.classList.add('leaving');
    setTimeout(function(){
      window.location.href = redirectTarget;
    }, 480);
  }

  // Auto-advance after a brief, classy beat
  var autoTimer = setTimeout(leave, 2600);

  // Let anyone skip ahead with a click/tap or key press
  document.addEventListener('click', leave);
  document.addEventListener('keydown', leave);
</script>

</body>
</html>
